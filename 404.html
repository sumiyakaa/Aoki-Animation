<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ページが見つかりません — Aoki Animation</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600&family=Barlow+Condensed:wght@700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: "Noto Sans JP", sans-serif; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; text-align: center; }
    .num { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: clamp(110px, 22vw, 220px); line-height: 1; }
    .msg { font-size: 14px; letter-spacing: 0.1em; margin-top: 18px; color: rgba(255,255,255,0.7); }
    a { display: inline-block; margin-top: 40px; color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,0.75); padding: 14px 44px; font-family: "Barlow", sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.22em; transition: background .3s, color .3s; }
    a:hover { background: #fff; color: #000; }
    .bar { width: 64px; height: 3px; background: #1AA095; margin: 26px auto 0; }
  </style>
</head>
<body>
  <div>
    <p class="num">404</p>
    <p class="msg">お探しのページが見つかりませんでした。</p>
    <div class="bar"></div>
    <a href="./">BACK TO TOP</a>
  </div>
</body>
</html>
